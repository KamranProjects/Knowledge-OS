<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Force fetch to be non-writable to avoid "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      // which happens when libraries attempt to polyfill global fetch.
      try {
        var originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return originalFetch; },
          set: function() { console.warn('Blocked attempt to overwrite window.fetch'); },
          configurable: false
        });
      } catch (e) {
        console.error('Failed to lock fetch:', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
